services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:15434:5432"
    volumes:
      - labaccess-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  labaccess-postgres-data:
